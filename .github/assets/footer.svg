<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="">
  <title>Footer</title>

  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="45%"  stop-color="#003d7c"/>
      <stop offset="75%"  stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#062a52"/>
      <stop offset="100%" stop-color="#0a6f8c"/>
    </linearGradient>

    <style>
      .tw   { animation: twinkle 3.4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
      .t2 { animation-delay: .7s; }  .t3 { animation-delay: 1.4s; }
      .t4 { animation-delay: 2.1s; } .t5 { animation-delay: 2.8s; }

      .fdrift { animation: fdrift 11s linear infinite; }
      @keyframes fdrift { from { transform: translateX(-600px); } to { transform: translateX(0); } }

      @media (prefers-reduced-motion: reduce) {
        .tw { animation: none; opacity: .6; }
        .fdrift { animation: none; }
      }
    </style>
  </defs>

  <!-- flipped so the wave crests along the top edge -->
  <g transform="translate(0,120) scale(1,-1)">
    <rect width="1200" height="120" fill="url(#fsky)"/>
    <g transform="translate(0,52)">
      <g class="fdrift">
        <path fill="url(#fwave)" opacity=".6"
              d="M0,30 q150,-26 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 L2400,120 L0,120 Z"/>
      </g>
    </g>
  </g>

  <g fill="#a5d8e8">
    <circle class="tw"    cx="170"  cy="34" r="2"/>
    <circle class="tw t2" cx="420"  cy="22" r="1.6"/>
    <circle class="tw t3" cx="660"  cy="40" r="2.2"/>
    <circle class="tw t4" cx="900"  cy="26" r="1.8"/>
    <circle class="tw t5" cx="1080" cy="44" r="2"/>
  </g>
</svg>
